<template>

    <lightning-card>
        <div style="margin-top: -22px;">
    <lightning-card title="Audio Recording" icon-name="utility:listen">
        <div class="slds-var-m-around_medium">

            <template if:true={recordId}>
                <audio
                    src={audioSrc}
                    onplay={handleOnPlay}
                    onseeked={handleOnSeeked}
                    onseeking={handleOnSeeking}
                    onpause={handleOnPause}
                    ontimeupdate={handleOnTimeUpdate}
                    preload="metadata"
                >
                </audio>

                <div class="waveform-panel">
                    <!-- Seekable waveform: gray base bars + blue played layer clipped to position -->
                    <div class="waveform-track" onclick={handleSeek}>
                        <div class="wf-bars wf-bars-base">
                            <span class="wf-bar"></span><span class="wf-bar"></span><span class="wf-bar"></span><span class="wf-bar"></span><span class="wf-bar"></span>
                            <span class="wf-bar"></span><span class="wf-bar"></span><span class="wf-bar"></span><span class="wf-bar"></span><span class="wf-bar"></span>
                            <span class="wf-bar"></span><span class="wf-bar"></span><span class="wf-bar"></span><span class="wf-bar"></span><span class="wf-bar"></span>
                            <span class="wf-bar"></span><span class="wf-bar"></span><span class="wf-bar"></span><span class="wf-bar"></span><span class="wf-bar"></span>
                            <span class="wf-bar"></span><span class="wf-bar"></span><span class="wf-bar"></span><span class="wf-bar"></span><span class="wf-bar"></span>
                            <span class="wf-bar"></span><span class="wf-bar"></span><span class="wf-bar"></span><span class="wf-bar"></span><span class="wf-bar"></span>
                            <span class="wf-bar"></span><span class="wf-bar"></span><span class="wf-bar"></span><span class="wf-bar"></span><span class="wf-bar"></span>
                            <span class="wf-bar"></span><span class="wf-bar"></span><span class="wf-bar"></span><span class="wf-bar"></span><span class="wf-bar"></span>
                        </div>
                        <div class={waveClass} style={waveformProgressStyle}>
                            <span class="wf-bar"></span><span class="wf-bar"></span><span class="wf-bar"></span><span class="wf-bar"></span><span class="wf-bar"></span>
                            <span class="wf-bar"></span><span class="wf-bar"></span><span class="wf-bar"></span><span class="wf-bar"></span><span class="wf-bar"></span>
                            <span class="wf-bar"></span><span class="wf-bar"></span><span class="wf-bar"></span><span class="wf-bar"></span><span class="wf-bar"></span>
                            <span class="wf-bar"></span><span class="wf-bar"></span><span class="wf-bar"></span><span class="wf-bar"></span><span class="wf-bar"></span>
                            <span class="wf-bar"></span><span class="wf-bar"></span><span class="wf-bar"></span><span class="wf-bar"></span><span class="wf-bar"></span>
                            <span class="wf-bar"></span><span class="wf-bar"></span><span class="wf-bar"></span><span class="wf-bar"></span><span class="wf-bar"></span>
                            <span class="wf-bar"></span><span class="wf-bar"></span><span class="wf-bar"></span><span class="wf-bar"></span><span class="wf-bar"></span>
                            <span class="wf-bar"></span><span class="wf-bar"></span><span class="wf-bar"></span><span class="wf-bar"></span><span class="wf-bar"></span>
                        </div>
                        <div class="wf-playhead" style={playheadStyle}></div>
                    </div>

                    <div class="player-controls">
                        <span class="player-time">{currentTimeFormatted} / {totalTimeFormatted}</span>
                        <div class="player-controls-center">
                            <button class="skip-btn" onclick={handleSkipBack} title="Rewind 15s">
                                <lightning-icon icon-name="utility:undo" size="xx-small"></lightning-icon>
                            </button>
                            <button class="play-btn" title={playPauseAltText} onclick={handlePlayPause}>
                                <lightning-icon icon-name={playPauseIcon} size="small" variant="inverse"></lightning-icon>
                            </button>
                            <button class="skip-btn" onclick={handleSkipForward} title="Forward 15s">
                                <lightning-icon icon-name="utility:redo" size="xx-small"></lightning-icon>
                            </button>
                        </div>
                        <div class="player-controls-right">
                            <button class="speed-btn" onclick={handleSpeedChange} title="Playback speed">{playbackSpeedLabel}</button>
                            <div class="volume-wrap">
                                <lightning-icon icon-name="utility:volume_high" size="xx-small"></lightning-icon>
                                <input type="range" class="volume-slider" min="0" max="100" value={volumeLevel} onchange={handleVolumeChange}/>
                            </div>
                        </div>
                    </div>
                </div>
