          <template if:true={hasInsightsData}>

            <!-- KPI row -->
            <div class="grid grid-4">
              <div class="card kpi">
                <div class="kpi-label">🔢 Calls analysed</div>
                <div class="kpi-value">{masterTotalCalls}</div>
                <div class="kpi-sub">{masterFilterLabel}</div>
              </div>
              <div class="card kpi">
                <div class="kpi-label">⭐ Quality score</div>
                <div class="kpi-value">{masterAvgDisplay.value}<span style="font-size:14px; color: var(--slds-neutral-50);">/{masterAvgDisplay.max}</span></div>
                <div class="kpi-sub">{masterAvgDisplay.percent}% of scale</div>
              </div>
              <div class="card kpi">
                <div class="kpi-label">😊 Positive sentiment</div>
                <div class="kpi-value">{insightsSentiment.positivePct}%</div>
                <div class="kpi-sub">{insightsSentiment.positive} positive · {insightsSentiment.negative} negative</div>
              </div>
              <div class="card kpi">
                <div class="kpi-label">⚠️ Fatal interactions</div>
                <div class="kpi-value" style="color: var(--slds-error);">{masterFatalCount}</div>
                <div class="kpi-sub">across analysed calls</div>
              </div>
            </div>

            <div class="grid grid-3-2">
              <!-- Score by lead type -->
              <div class="card">
                <div class="card-header"><div class="card-title">Quality score by lead type</div></div>
                <div class="card-body">
                  <template if:true={hasInsightsByLeadType}>
                    <template for:each={insightsByLeadType} for:item="t">
                      <div key={t.key} class="score-row">
                        <span class="name">{t.label} <span class="count">({t.countLabel})</span></span>
                        <div class="bar"><div class="bar-fill" style={t.barStyle}></div></div>
                        <span class="val">{t.avgDisplay}</span>
                      </div>
                    </template>
                  </template>
                  <div class="chart-caption"><span>Averaged across analysed calls per journey (1–5 scale)</span></div>
                </div>
              </div>

              <!-- Sentiment mix -->
              <div class="card">
                <div class="card-header"><div class="card-title">Customer sentiment mix</div></div>
                <div class="card-body">
                  <div class="score-row">
                    <span class="name">😊 Positive</span>
                    <div class="bar"><div class="bar-fill" style={insightsSentimentBars.positive}></div></div>
                    <span class="val">{insightsSentiment.positivePct}%</span>
                  </div>
                  <div class="score-row">
                    <span class="name">😐 Neutral</span>
                    <div class="bar"><div class="bar-fill" style={insightsSentimentBars.neutral}></div></div>
                    <span class="val">{insightsSentiment.neutralPct}%</span>
                  </div>
                  <div class="score-row">
                    <span class="name">😟 Negative</span>
                    <div class="bar"><div class="bar-fill" style={insightsSentimentBars.negative}></div></div>
                    <span class="val">{insightsSentiment.negativePct}%</span>
                  </div>
                </div>
              </div>
            </div>

            <!-- Weakest-parameter distribution -->
            <div class="card">
              <div class="card-header"><div class="card-title">Most common weakest parameter <span class="count">— where coaching is needed most</span></div></div>
              <div class="card-body">
                <template if:true={hasInsightsWeakestDist}>
                  <template for:each={insightsWeakestDist} for:item="w">
                    <div key={w.key} class="score-row">
                      <span class="name">{w.label}</span>
                      <div class="bar"><div class="bar-fill" style={w.barStyle}></div></div>
                      <span class="val">{w.countLabel}</span>
                    </div>
                  </template>
                </template>
                <template if:false={hasInsightsWeakestDist}>
                  <p class="muted">No scored calls in this range.</p>
                </template>
              </div>
            </div>

            <!-- ============================================================ -->
            <!-- ◇ ILLUSTRATIVE PANELS (MOCK — fixed sample data, no live      -->
            <!-- source field yet). The ◇ glyph in each title marks these as   -->
            <!-- illustrative; they do NOT change with the record set.         -->
            <!-- ============================================================ -->
            <!-- ◇ Row A: Top categories · Design trends · Product gaps -->
            <div class="grid grid-3">
              <div class="card">
                <div class="card-header"><div class="card-title">Top requested categories ◇</div></div>
                <div class="card-body">
                  <template for:each={mockTopCategories} for:item="c">
                    <div key={c.key} class="score-row">
                      <span class="name">{c.label}</span>
                      <div class="bar"><div class="bar-fill" style={c.barStyle}></div></div>
                      <span class="val">{c.countLabel}</span>
                    </div>
                  </template>
                  <div class="chart-caption"><span>Category asked-about in conversation</span></div>
                </div>
              </div>

              <div class="card">
                <div class="card-header"><div class="card-title">Design preference trends ◇</div></div>
                <div class="card-body">
                  <div class="mca-mock-cloud">
                    <template for:each={mockDesignTrends} for:item="t">
                      <span key={t.key} class={t.chipClass}>{t.text}</span>
                    </template>
                  </div>
                  <div class="chart-caption"><span>Font size = mention volume · ▲▼ = 30-day trend</span></div>
                </div>
              </div>

              <div class="card">
                <div class="card-header"><div class="card-title">Product gaps &amp; unmet needs ◇</div></div>
                <div class="card-body">
                  <template for:each={mockProductGaps} for:item="g">
                    <div key={g.key} class="mca-mock-gap" style={g.cardStyle}>
                      <div class="mca-mock-gap-title" style={g.titleStyle}>{g.title}</div>
                      <div class="mca-mock-gap-desc">{g.desc}</div>
                    </div>
                  </template>
                </div>
              </div>
            </div>

            <!-- ◇ Row B: Channel split · Fulfilment friction · Drop-off heatmap -->
            <div class="grid grid-3">
              <div class="card">
                <div class="card-header"><div class="card-title">Store vs. digital preference ◇</div></div>
                <div class="card-body">
                  <div class="mca-mock-donut-wrap">
                    <div class="mca-mock-donut">
                      <svg viewBox="0 0 64 64" class="mca-mock-donut-svg">
                        <circle cx="32" cy="32" r="28" fill="none" stroke="#EEF1F6" stroke-width="8"></circle>
                        <template for:each={mockChannelSplit.segments} for:item="s">
                          <circle key={s.key} cx="32" cy="32" r="28" fill="none" stroke-width="8"
                            transform="rotate(-90 32 32)" style={s.style}></circle>
                        </template>
                      </svg>
                      <div class="mca-mock-donut-center">
                        <span class="mca-mock-donut-val">{mockChannelSplit.topPct}</span>
                        <span class="mca-mock-donut-lbl">{mockChannelSplit.topLabel}</span>
                      </div>
                    </div>
                    <div class="mca-mock-donut-legend">
                      <template for:each={mockChannelSplit.legend} for:item="c">
                        <div key={c.key} class="mca-mock-legend-row">
                          <span class="mca-legend-dot" style={c.dotStyle}></span>
                          <span class="mca-mock-legend-name">{c.label}</span>
                          <span class="mca-mock-legend-pct">{c.pctLabel}</span>
                        </div>
                      </template>
                    </div>
                  </div>
                </div>
              </div>

              <div class="card">
                <div class="card-header"><div class="card-title">Fulfilment friction ◇</div></div>
                <div class="card-body">
                  <template for:each={mockFulfilment} for:item="f">
                    <div key={f.key} class="score-row">
                      <span class="name">{f.label}</span>
                      <div class="bar"><div class="bar-fill" style={f.barStyle}></div></div>
                      <span class="val">{f.countLabel}</span>
                    </div>
                  </template>
                  <div class="chart-caption"><span>Complaints per topic</span></div>
                </div>
              </div>

              <div class="card">
                <div class="card-header"><div class="card-title">Drop-off reasons by channel ◇</div></div>
                <div class="card-body">
                  <table class="mca-mock-matrix">
                    <thead>
                      <tr><th>Reason</th><th>Call</th><th>Store</th><th>Web</th></tr>
                    </thead>
                    <tbody>
                      <template for:each={mockDropoffMatrix} for:item="r">
                        <tr key={r.key}>
                          <td class="mca-mock-matrix-lbl">{r.reason}</td>
                          <td><span class="mca-mock-cell" style={r.call.style}>{r.call.display}</span></td>
                          <td><span class="mca-mock-cell" style={r.store.style}>{r.store.display}</span></td>
                          <td><span class="mca-mock-cell" style={r.web.style}>{r.web.display}</span></td>
                        </tr>
                      </template>
                    </tbody>
                  </table>
                </div>
              </div>
            </div>

            <!-- ◇ Row C: Sentiment heatmap · Positive drivers / Negative triggers -->
            <div class="grid grid-3-2">
              <div class="card">
                <div class="card-header"><div class="card-title">Sentiment across categories &amp; regions ◇</div></div>
                <div class="card-body">
                  <table class="mca-mock-matrix">
                    <thead>
                      <tr><th>Category</th><th>North</th><th>South</th><th>East</th><th>West</th><th>All-India</th></tr>
                    </thead>
                    <tbody>
                      <template for:each={mockSentimentMatrix} for:item="r">
                        <tr key={r.key}>
                          <td class="mca-mock-matrix-lbl">{r.cat}</td>
                          <td><span class="mca-mock-cell" style={r.north.style}>{r.north.display}</span></td>
                          <td><span class="mca-mock-cell" style={r.south.style}>{r.south.display}</span></td>
                          <td><span class="mca-mock-cell" style={r.east.style}>{r.east.display}</span></td>
                          <td><span class="mca-mock-cell" style={r.west.style}>{r.west.display}</span></td>
                          <td class="mca-mock-matrix-all">{r.allLabel}</td>
                        </tr>
                      </template>
                    </tbody>
                  </table>
                </div>
              </div>

              <div class="mca-mock-stack">
                <div class="card">
                  <div class="card-header">
                    <div class="card-title">😊 Positive drivers</div>
                    <div class="card-sub">{insightsVocSubtitle}</div>
                  </div>
                  <div class="card-body">
                    <template if:true={hasInsightsPositiveDrivers}>
                      <div class="mca-mock-cloud">
                        <template for:each={insightsPositiveDrivers} for:item="p">
                          <span key={p.key} class={p.chipClass}>{p.label}</span>
                        </template>
                      </div>
                    </template>
                    <template if:false={hasInsightsPositiveDrivers}>
                      <div class="chart-caption"><span>No positive customer cues found in the analysed calls yet.</span></div>
                    </template>
                  </div>
                </div>
                <div class="card">
                  <div class="card-header">
                    <div class="card-title">⚠️ Negative triggers</div>
                    <div class="card-sub">From real customer objections</div>
                  </div>
                  <div class="card-body">
                    <template if:true={hasInsightsNegativeTriggers}>
                      <div class="mca-mock-cloud">
                        <template for:each={insightsNegativeTriggers} for:item="n">
                          <span key={n.key} class={n.chipClass}>{n.label}</span>
                        </template>
                      </div>
                    </template>
                    <template if:false={hasInsightsNegativeTriggers}>
                      <div class="chart-caption"><span>No customer objections surfaced in the analysed calls.</span></div>
                    </template>
                  </div>
                </div>
              </div>
            </div>

            <!-- Brand keywords word cloud — mined from customer speech -->
            <div class="card">
              <div class="card-header">
                <div class="card-title">Keywords customers associate with the brand</div>
                <div class="card-sub">{insightsVocSubtitle}</div>
              </div>
              <div class="card-body">
                <template if:true={hasInsightsBrandKeywords}>
                  <div class="mca-mock-cloud mca-mock-cloud-center">
                    <template for:each={insightsBrandKeywords} for:item="w">
                      <span key={w.key} class={w.chipClass}>{w.label}</span>
                    </template>
                  </div>
                </template>
                <template if:false={hasInsightsBrandKeywords}>
                  <div class="chart-caption"><span>Not enough customer speech captured to build a keyword cloud.</span></div>
                </template>
              </div>
            </div>

            <!-- ◇ Row D: Brand perception vs competitors · Recalled campaigns -->
            <div class="grid grid-3-2">
              <div class="card">
                <div class="card-header"><div class="card-title">Marketing &amp; branding perception vs. competitors ◇</div></div>
                <div class="card-body">
                  <table class="mca-mock-matrix">
                    <thead>
                      <tr><th>Brand</th><th>Ad recall</th><th>Ad-compelling</th><th>Trust score</th></tr>
                    </thead>
                    <tbody>
                      <template for:each={mockBrandPerception} for:item="r">
                        <tr key={r.key}>
                          <td class={r.brandClass}>{r.brand}</td>
                          <td><span class={r.recall.chipClass}>{r.recall.display}</span></td>
                          <td><span class={r.compelling.chipClass}>{r.compelling.display}</span></td>
                          <td><span class={r.trust.chipClass}>{r.trust.display}</span></td>
                        </tr>
                      </template>
                    </tbody>
                  </table>
                </div>
              </div>

              <div class="card">
                <div class="card-header"><div class="card-title">Naturally recalled campaigns ◇</div></div>
                <div class="card-body">
                  <template for:each={mockRecalledCampaigns} for:item="c">
                    <div key={c.key} class="score-row">
                      <span class="name">{c.label}</span>
                      <div class="bar"><div class="bar-fill" style={c.barStyle}></div></div>
                      <span class="val">{c.pctLabel}</span>
                    </div>
                  </template>
                  <div class="chart-caption"><span>Recalled unprompted in customer conversation</span></div>
                </div>
              </div>
            </div>

            <!-- ◇ Store experience & service benchmarking -->
            <div class="card">
              <div class="card-header"><div class="card-title">Store experience &amp; service benchmarking ◇</div></div>
              <div class="card-body">
                <table class="mca-mock-matrix">
                  <thead>
                    <tr><th>Experience dimension</th><th>Aurelia</th><th>Meridian</th><th>Kestrel</th><th>Jovian</th><th>Pinnacle</th><th>Our position</th></tr>
                  </thead>
                  <tbody>
                    <template for:each={mockServiceBenchmark} for:item="r">
                      <tr key={r.key}>
                        <td class="mca-mock-matrix-lbl">{r.dim}</td>
                        <td><span class="mca-mock-cell" style={r.t.style}>{r.t.display}</span></td>
                        <td><span class="mca-mock-cell" style={r.m.style}>{r.m.display}</span></td>
                        <td><span class="mca-mock-cell" style={r.k.style}>{r.k.display}</span></td>
                        <td><span class="mca-mock-cell" style={r.j.style}>{r.j.display}</span></td>
                        <td><span class="mca-mock-cell" style={r.p.style}>{r.p.display}</span></td>
                        <td><span class={r.posClass}>{r.pos}</span></td>
                      </tr>
                    </template>
                  </tbody>
                </table>
                <div class="chart-caption"><span>Customer-verbatim-derived score, 1–5</span></div>
              </div>
            </div>

            <!-- Sentiment trajectory + KPI adherence -->
            <div class="grid grid-3-2">
              <!-- KPI adherence: where behaviours are most often missed -->
              <div class="card">
                <div class="card-header"><div class="card-title">Behaviours most often missed <span class="count">— across every scored call</span></div></div>
                <div class="card-body">
                  <template if:true={hasInsightsKpiAdherence}>
                    <template for:each={insightsKpiAdherence} for:item="k">
                      <div key={k.key} class="mca-kpi-row">
                        <div class="mca-kpi-top">
                          <span class="mca-kpi-q">{k.label}</span>
                          <span class="mca-kpi-tag" style={k.tagStyle}>{k.tagLabel}</span>
                        </div>
                        <div class="mca-kpi-track">
                          <div class="mca-kpi-seg" style={k.yesStyle}></div>
                          <div class="mca-kpi-seg" style={k.partialStyle}></div>
                          <div class="mca-kpi-seg" style={k.noStyle}></div>
                        </div>
                        <div class="mca-kpi-meta">
                          <span class="mca-kpi-split">{k.splitLabel}</span>
                          <span class="mca-kpi-met">{k.metPct} met</span>
                        </div>
                      </div>
                    </template>
                  </template>
                  <template if:false={hasInsightsKpiAdherence}>
                    <p class="muted">No KPI evaluations recorded across these calls.</p>
                  </template>
                  <div class="chart-caption"><span>Ranked worst-first · met = full credit for Yes, half for Partial</span></div>
                </div>
              </div>

              <!-- Sentiment trajectory: start vs end of call -->
              <div class="card">
                <div class="card-header"><div class="card-title">Sentiment trajectory <span class="count">— start → end of call</span></div></div>
                <div class="card-body">
                  <template if:true={hasInsightsSentimentJourney}>
                    <div class="mca-traj-net">
                      <span class="mca-traj-net-val">{insightsSentimentJourney.netLabel}</span>
                      <span class="mca-traj-net-lbl">net turnaround</span>
                    </div>
                    <div class="score-row">
                      <span class="name">📈 Improved</span>
                      <div class="bar"><div class="bar-fill" style={insightsSentimentJourney.improvedBarStyle}></div></div>
                      <span class="val">{insightsSentimentJourney.improved} · {insightsSentimentJourney.improvedPct}%</span>
                    </div>
                    <div class="score-row">
                      <span class="name">➖ Held steady</span>
                      <div class="bar"><div class="bar-fill" style={insightsSentimentJourney.heldBarStyle}></div></div>
                      <span class="val">{insightsSentimentJourney.held} · {insightsSentimentJourney.heldPct}%</span>
                    </div>
                    <div class="score-row">
                      <span class="name">📉 Declined</span>
                      <div class="bar"><div class="bar-fill" style={insightsSentimentJourney.declinedBarStyle}></div></div>
                      <span class="val">{insightsSentimentJourney.declined} · {insightsSentimentJourney.declinedPct}%</span>
                    </div>

                    <!-- Opening vs closing sentiment mix — shows WHERE the turnaround comes from -->
                    <div class="mca-traj-shift">
                      <div class="mca-traj-shift-hdr">Where the shift happens</div>
                      <template for:each={insightsSentimentJourney.bookends} for:item="b">
                        <div key={b.key} class="mca-traj-book">
                          <div class="mca-traj-book-top">
                            <span class="mca-traj-book-lbl">{b.label}</span>
                            <span class="mca-traj-book-cap">{b.caption}</span>
                          </div>
                          <div class="mca-traj-stack">
                            <div class="mca-traj-seg" style={b.posStyle}></div>
                            <div class="mca-traj-seg" style={b.neuStyle}></div>
                            <div class="mca-traj-seg" style={b.negStyle}></div>
                          </div>
                        </div>
                      </template>
                      <div class="mca-traj-legend">
                        <span class="mca-traj-key"><span class="mca-traj-dot" style="background:#16A34A;"></span>Positive</span>
                        <span class="mca-traj-key"><span class="mca-traj-dot" style="background:#94A3B8;"></span>Neutral</span>
                        <span class="mca-traj-key"><span class="mca-traj-dot" style="background:#DC2626;"></span>Negative</span>
                      </div>
                    </div>

                    <div class="chart-caption"><span>Opening vs closing sentiment on {insightsSentimentJourney.total} calls</span></div>
                  </template>
                  <template if:false={hasInsightsSentimentJourney}>
                    <p class="muted">No start/end sentiment recorded across these calls.</p>
                  </template>
                </div>
              </div>
            </div>

            <!-- Coaching feed (real per-call improvement notes) -->
            <div class="card">
              <div class="card-header"><div class="card-title">🎯 Coaching feed <span class="count">— real scope-of-improvement notes</span></div></div>
              <div class="card-body">
                <template if:true={hasInsightsCoaching}>
                  <div class="mca-coach">
                    <template for:each={insightsCoaching} for:item="g">
                      <div key={g.key} class="mca-coach-group">
                        <button class="mca-coach-head" style={g.headStyle} data-key={g.key} data-open={g.open} onclick={handleCoachToggle}>
                          <span class="mca-coach-caret">{g.caret}</span>
                          <span class="mca-coach-dot" style={g.dotStyle}></span>
                          <span class="mca-coach-theme">{g.theme}</span>
                          <span class="mca-coach-count">{g.countLabel}</span>
                        </button>
                        <div class={g.bodyClass}>
                          <div class="mca-coach-agents">
                            <template for:each={g.agents} for:item="a">
                              <div key={a.key} class="mca-coach-agent">
                                <div class="mca-coach-agent-hdr">
                                  <span class="mca-coach-avatar">{a.initials}</span>
                                  <span class="mca-coach-agent-name">{a.agent}</span>
                                  <span class="mca-coach-agent-count">{a.countLabel}</span>
                                </div>
                                <div class="mca-coach-grid">
                                  <template for:each={a.notes} for:item="n">
                                    <div key={n.key} class="mca-coach-item">
                                      <div class="mca-coach-text">{n.text}</div>
                                      <div class="mca-coach-ctx">{n.context}</div>
                                    </div>
                                  </template>
                                </div>
                              </div>
                            </template>
                          </div>
                        </div>
                      </div>
                    </template>
                  </div>
                </template>
                <template if:false={hasInsightsCoaching}>
                  <p class="muted">No improvement notes recorded across these calls.</p>
                </template>
              </div>
            </div>

          </template>
          </template>

        </div>
        </template>

    </div>
</template>
